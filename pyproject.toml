[project]
name = "muys-fastapi"
version = "0.3.0"
description = "MÜYS - Üretim Yönetim Sistemi (FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "SQLAlchemy>=2.0",
    "pydantic>=2.0",
    "python-dotenv",
    "python-multipart",
    "Jinja2",
    "psycopg[binary]",
    "pwdlib[argon2]",
    "openpyxl",
    "pywebpush",
    "email-validator",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
