{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-xl-8">

            <div class="card shadow-sm border-0">

                <div class="card-body p-5">

                    <div class="text-center">

                        <i class="bi bi-person-circle display-1 text-primary"></i>

                        <h2 class="mt-3 mb-1">

                            {{ kullanici_adi }}

                        </h2>

                        <span class="badge bg-primary">

                            {{ kullanici_rol }}

                        </span>

                    </div>

                    <hr class="my-4">

                    <div class="row">

                        <div class="col-md-6">

                            <label class="form-label">
                                Kullanıcı Adı
                            </label>

                            <input
                                class="form-control"
                                value="{{ kullanici_adi }}"
                                readonly>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Yetki
                            </label>

                            <input
                                class="form-control"
                                value="{{ kullanici_rol }}"
                                readonly>

                        </div>

                    </div>

                    <div class="row mt-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Yeni Şifre
                            </label>

                            <input
                                type="password"
                                class="form-control">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Yeni Şifre Tekrar
                            </label>

                            <input
                                type="password"
                                class="form-control">

                        </div>

                    </div>

                    <div class="text-end mt-4">

                        <button class="btn btn-primary">

                            <i class="bi bi-key"></i>

                            Şifreyi Güncelle

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
