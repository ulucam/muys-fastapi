{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="row">

        <div class="col-lg-10 mx-auto">

            <div class="card shadow-sm">

                <div class="card-header">

                    <h4 class="mb-0">
                        ✏️ Müşteri Düzenle
                    </h4>

                </div>

                <div class="card-body">

                    <form method="post" action="/musteriler/duzenle/{{ musteri.id }}">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Müşteri Kodu
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    value="{{ musteri.musteri_kodu }}"
                                    readonly>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Firma Adı
                                </label>

                                <input
                                    type="text"
                                    name="firma_adi"
                                    class="form-control"
                                    value="{{ musteri.firma_adi }}"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Yetkili
                                </label>

                                <input
                                    type="text"
                                    name="yetkili"
                                    class="form-control"
                                    value="{{ musteri.yetkili or '' }}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Telefon
                                </label>

                                <input
                                    type="text"
                                    name="telefon"
                                    class="form-control"
                                    value="{{ musteri.telefon or '' }}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    E-Posta
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    value="{{ musteri.email or '' }}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Vergi No
                                </label>

                                <input
                                    type="text"
                                    name="vergi_no"
                                    class="form-control"
                                    value="{{ musteri.vergi_no or '' }}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Vergi Dairesi
                                </label>

                                <input
                                    type="text"
                                    name="vergi_dairesi"
                                    class="form-control"
                                    value="{{ musteri.vergi_dairesi or '' }}">

                            </div>

                            <div class="col-md-3 mb-3">

                                <label class="form-label">
                                    İl
                                </label>

                                <input
                                    type="text"
                                    name="il"
                                    class="form-control"
                                    value="{{ musteri.il or '' }}">

                            </div>

                            <div class="col-md-3 mb-3">

                                <label class="form-label">
                                    İlçe
                                </label>

                                <input
                                    type="text"
                                    name="ilce"
                                    class="form-control"
                                    value="{{ musteri.ilce or '' }}">

                            </div>

                            <div class="col-12 mb-3">

                                <label class="form-label">
                                    Adres
                                </label>

                                <textarea
                                    name="adres"
                                    rows="3"
                                    class="form-control">{{ musteri.adres or '' }}</textarea>

                            </div>

                            <div class="col-12 mb-3">

                                <label class="form-label">
                                    Açıklama
                                </label>

                                <textarea
                                    name="aciklama"
                                    rows="3"
                                    class="form-control">{{ musteri.aciklama or '' }}</textarea>

                            </div>

                            <div class="col-md-3 mb-4">

                                <div class="form-check mt-4">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="aktif"
                                        value="true"
                                        {% if musteri.aktif %}checked{% endif %}>

                                    <label class="form-check-label">

                                        Aktif

                                    </label>

                                </div>

                            </div>

                        </div>

                        <div class="d-flex justify-content-end">

                            <a
                                href="/musteriler"
                                class="btn btn-secondary me-2">

                                Vazgeç

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                💾 Güncelle

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
