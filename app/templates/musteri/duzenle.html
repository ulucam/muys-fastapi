{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="row">

        <div class="col-lg-10 mx-auto">

            <div class="card shadow-sm">

                <div class="card-header">

                    <h4 class="mb-0">
                        ✏️ Müşteri Düzenle
                    </h4>

                </div>

                <div class="card-body">

                    <form method="post" action="/musteriler/duzenle/{{ musteri.id }}">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Müşteri Kodu
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    value="{{ musteri.musteri_kodu }}"
                                    readonly>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Müşteri Türü
                                </label>

                                <select name="musteri_turu" class="form-select">
                                    {% for tur in ["Alıcı", "Tedarikçi", "Satıcı"] %}
                                    <option value="{{ tur }}" {% if (musteri.musteri_turu or "Alıcı") == tur %}selected{% endif %}>{{ tur }}</option>
                                    {% endfor %}
                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Firma Adı
                                </label>

                                <input
                                    type="text"
                                    name="firma_adi"
                                    class="form-control"
                                    value="{{ musteri.firma_adi }}"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Yetkili
                                </label>

                                <input
                                    type="text"
                                    name="yetkili"
                                    class="form-control"
                                    value="{{ musteri.yetkili or '' }}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Telefon
                                </label>

                                <input
                                    type="text"
                                    name="telefon"
                                    class="form-control"
                                    value="{{ musteri.telefon or '' }}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    E-Posta
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    value="{{ musteri.email or '' }}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Vergi No
                                </label>

                                <input
                                    type="text"
                                    name="vergi_no"
                                    class="form-control"
                                    value="{{ musteri.vergi_no or '' }}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Vergi Dairesi
                                </label>

                                <input
                                    type="text"
                                    name="vergi_dairesi"
                                    class="form-control"
                                    value="{{ musteri.vergi_dairesi or '' }}">

                            </div>

                            <div class="col-md-3 mb-3">

                                <label class="form-label">
                                    İl
                                </label>

                                <select name="il" id="il" class="form-select">
                                    <option value="">İl seçin</option>
                                    {% for il_adi in ilceler %}
                                    <option value="{{ il_adi }}" {% if musteri.il == il_adi %}selected{% endif %}>{{ il_adi }}</option>
                                    {% endfor %}
                                </select>

                            </div>

                            <div class="col-md-3 mb-3">

                                <label class="form-label">
                                    İlçe
                                </label>

                                <select name="ilce" id="ilce" class="form-select">
                                    <option value="">İlçe seçin</option>
                                </select>

                            </div>

                            <div class="col-12 mb-3">

                                <label class="form-label">
                                    Adres
                                </label>

                                <textarea
                                    name="adres"
                                    rows="3"
                                    class="form-control">{{ musteri.adres or '' }}</textarea>

                            </div>

                            <div class="col-12 mb-3">

                                <label class="form-label">
                                    Açıklama
                                </label>

                                <textarea
                                    name="aciklama"
                                    rows="3"
                                    class="form-control">{{ musteri.aciklama or '' }}</textarea>

                            </div>

                            <div class="col-md-3 mb-4">

                                <div class="form-check mt-4">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="aktif"
                                        value="true"
                                        {% if musteri.aktif %}checked{% endif %}>

                                    <label class="form-check-label">

                                        Aktif

                                    </label>

                                </div>

                            </div>

                        </div>

                        <div class="d-flex justify-content-between">

                            {% if kullanici_rol == "Admin" %}
                            <button type="submit" class="btn btn-outline-danger" formaction="/musteriler/sil/{{ musteri.id }}" formmethod="post" onclick="return confirm('Bu firmayı silmek istediğinize emin misiniz?');">🗑️ Firmayı Sil</button>
                            {% else %}
                            <span></span>
                            {% endif %}

                            <div>
                            <a
                                href="/musteriler"
                                class="btn btn-secondary me-2">

                                Vazgeç

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                💾 Güncelle

                            </button>
                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
const ilceler = {{ ilceler | tojson }};
const ilSecimi = document.getElementById("il");
const ilceSecimi = document.getElementById("ilce");
const seciliIlce = {{ (musteri.ilce or '') | tojson }};

function ilceleriDoldur() {
    const seciliIlceler = ilceler[ilSecimi.value] || [];
    ilceSecimi.innerHTML = '<option value="">İlçe seçin</option>';
    seciliIlceler.forEach(ilce => {
        ilceSecimi.add(new Option(ilce, ilce, false, ilce === seciliIlce));
    });
    ilceSecimi.disabled = !ilSecimi.value;
}

ilSecimi.addEventListener("change", ilceleriDoldur);
ilceleriDoldur();
</script>
{% endblock %}
