{% extends "base.html" %}
{% block content %}
<div class="container py-3"><div class="d-flex justify-content-between align-items-center"><h3>{{ duzenle_tipi|capitalize }} Düzenle</h3><a class="btn btn-outline-secondary" href="/uretim-tanimlari">Geri</a></div><div class="card shadow-sm"><div class="card-body">
<form method="post" action="/uretim-tanimlari/kaydet/{{ duzenle_tipi }}" class="row g-3">
<div class="col-md-4"><label class="form-label">Kod</label><input class="form-control" name="kodu" value="{{ kayit.kodu }}" readonly></div>
{% if duzenle_tipi == 'personel' %}
<div class="col-md-8"><label class="form-label">Ad Soyad</label><input class="form-control" name="ad_soyad" value="{{ kayit.ad_soyad }}" required></div><div class="col-md-6"><label class="form-label">Departman</label><input class="form-control" name="departman" value="{{ kayit.departman or '' }}"></div><div class="col-md-6"><label class="form-label">Görev</label><input class="form-control" name="gorev" value="{{ kayit.gorev or '' }}"></div>
{% elif duzenle_tipi == 'istasyon' %}
<div class="col-md-8"><label class="form-label">İstasyon Adı</label><input class="form-control" name="adi" value="{{ kayit.adi }}" required></div><div class="col-md-6"><label class="form-label">Bölüm</label><input class="form-control" name="bolum" value="{{ kayit.bolum or '' }}"></div><div class="col-md-6"><label class="form-label">Açıklama</label><input class="form-control" name="aciklama" value="{{ kayit.aciklama or '' }}"></div>
{% elif duzenle_tipi == 'sinif' %}
<div class="col-md-8"><label class="form-label">Ürün Sınıfı Adı</label><input class="form-control" name="adi" value="{{ kayit.adi }}" required></div><div class="col-12"><label class="form-label">Açıklama</label><input class="form-control" name="aciklama" value="{{ kayit.aciklama or '' }}"></div>
{% else %}
<div class="col-md-8"><label class="form-label">Makine Adı</label><input class="form-control" name="adi" value="{{ kayit.adi }}" required></div><div class="col-md-4"><label class="form-label">İstasyon</label><select class="form-select" name="istasyon_kodu">{% for i in istasyonlar %}<option value="{{ i.kodu }}" {% if i.id == kayit.istasyon_id %}selected{% endif %}>{{ i.kodu }} · {{ i.adi }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Model</label><input class="form-control" name="model" value="{{ kayit.model or '' }}"></div><div class="col-md-4"><label class="form-label">Kapasite</label><input class="form-control" name="kapasite" value="{{ kayit.kapasite or '' }}"></div>
{% endif %}
<div class="col-md-4"><label class="form-label">Durum</label><select class="form-select" name="aktif"><option value="true" {% if kayit.aktif %}selected{% endif %}>Aktif</option><option value="false" {% if not kayit.aktif %}selected{% endif %}>Pasif</option></select></div><div class="col-12"><a class="btn btn-secondary" href="/uretim-tanimlari">Vazgeç</a><button class="btn btn-primary" type="submit">Kaydet</button></div></form>
</div></div></div>
{% endblock %}
