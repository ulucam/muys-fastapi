<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>MÜYS</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/sidebar.css">
    <link rel="stylesheet" href="/static/css/navbar.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/cards.css">
    <link rel="stylesheet" href="/static/css/tables.css">
    <link rel="stylesheet" href="/static/css/forms.css">
    <link rel="stylesheet" href="/static/css/buttons.css">
    <link rel="stylesheet" href="/static/css/mobile.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="/static/css/pages/users.css">

</head>

<body class="bg-light">

<div class="d-flex">

    <!-- Sidebar -->
    {% include "components/sidebar.html" %}

    <div class="content flex-grow-1 d-flex flex-column min-vh-100">

        <!-- Navbar -->
        {% include "components/navbar.html" %}

        <!-- Sayfa -->
        <main class="container-fluid py-4">

            {% block content %}
            {% endblock %}

        </main>

        <!-- Footer -->
        {% include "components/footer.html" %}

    </div>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Main -->
<script src="/static/js/main.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const current = window.location.pathname;



    // =========================
    // Aktif Menü
    // =========================

    document.querySelectorAll(".sidebar .nav-link").forEach(function(link){

        const href = link.getAttribute("href");

        if(!href) return;

        link.classList.remove("active");

        if(href==="/"){

            if(current==="/"){

                link.classList.add("active");

            }

        }else{

            if(current===href || current.startsWith(href+"/")){

                link.classList.add("active");

            }

        }

    });



    // =========================
    // Sol Menü Mobil
    // =========================

    const sidebar = document.getElementById("sidebar");
    const toggle = document.getElementById("menuToggle");

    if(toggle){

        toggle.addEventListener("click",function(){

            sidebar.classList.toggle("show");

        });

    }

    document.addEventListener("click",function(e){

        if(window.innerWidth < 992){

            if(sidebar &&
               !sidebar.contains(e.target) &&
               toggle &&
               !toggle.contains(e.target)){

                sidebar.classList.remove("show");

            }

        }

    });



    // =========================
    // Stok Menüsü
    // =========================

    const stokMenu = document.getElementById("stokMenu");

    if(stokMenu){

        if(current.startsWith("/urunler") ||
           current.startsWith("/receteler")){

            new bootstrap.Collapse(stokMenu,{
                toggle:true
            });

        }

    }

});

</script>

</body>
</html>
