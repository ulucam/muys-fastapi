{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">
                <i class="bi bi-building text-info"></i>
                Firma Bilgileri
            </h2>

            <p class="text-muted mb-0">
                Firma bilgileri, logo ve iletişim ayarları.
            </p>

        </div>

        <a href="/ayarlar" class="btn btn-outline-secondary" data-page-back>
            <i class="bi bi-arrow-left"></i>
            Geri
        </a>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <form method="post" action="/ayarlar/firma">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Firma Adı</label>
                        <input type="text"
                               name="firma_adi"
                               class="form-control"
                               value="{{ firma.firma_adi if firma else '' }}"
                               placeholder="Firma adı">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Vergi No</label>
                        <input type="text"
                               name="vergi_no"
                               value="{{ firma.vergi_no if firma else '' }}"
                               class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Vergi Dairesi</label>
                        <input type="text"
                               name="vergi_dairesi"
                               value="{{ firma.vergi_dairesi if firma else '' }}"
                               class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Telefon</label>
                        <input type="text"
                               name="telefon"
                               value="{{ firma.telefon if firma else '' }}"
                               class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">E-posta</label>
                        <input type="email"
                               name="email"
                               value="{{ firma.email if firma else '' }}"
                               class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Web Sitesi</label>
                        <input type="text"
                               name="web_sitesi"
                               value="{{ firma.web_sitesi if firma else '' }}"
                               class="form-control">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Adres</label>
                        <textarea class="form-control"
                                  name="adres"
                                  rows="3">{{ firma.adres if firma else '' }}</textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Firma Logosu</label>
                        <input class="form-control"
                               type="file"
                               accept="image/*">
                    </div>

                </div>

                <hr class="my-4">

                <div class="text-end">

                    <button class="btn btn-primary" type="submit">

                        <i class="bi bi-check-circle"></i>

                        Kaydet

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
