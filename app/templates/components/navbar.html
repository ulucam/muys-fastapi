<nav class="top-navbar">

    <button id="menuToggle"
            class="mobile-menu-btn"
            type="button">

        <i class="bi bi-list"></i>

    </button>

    <div class="user-area">

        {% if kullanici_rol == "Admin" %}
        <div id="liveActivity" class="live-activity" aria-live="polite">
            <span class="live-activity-label"><span class="live-activity-dot"></span> Canlı</span>
            <span id="liveActivityText" class="live-activity-text">Yeni işlem bekleniyor</span>
        </div>
        <div class="dropdown activity-area">

            <button class="activity-button"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    aria-label="Son kullanıcı hareketleri">
                <i class="bi bi-bell"></i>
                <span id="activityBadge" class="activity-badge d-none"></span>
            </button>

            <div class="dropdown-menu dropdown-menu-end activity-panel p-0">
                <div class="activity-panel-header">
                    <strong>Son Hareketler</strong>
                    <small>Son 5 hareket</small>
                </div>
                <div id="activityFeed" class="activity-feed"></div>
                <a class="activity-history-link" href="/ayarlar/loglar"><i class="bi bi-clock-history me-1"></i> Tüm Log Geçmişi</a>
            </div>

        </div>
        {% endif %}

        <div class="dropdown">

            <button class="user-button"
                    data-bs-toggle="dropdown">

                <i class="bi bi-person-circle"></i>

                {{ kullanici_adi }}

                <i class="bi bi-chevron-down"></i>

            </button>

            <ul class="dropdown-menu dropdown-menu-end">

                <li>

                    <a class="dropdown-item"
                       href="/profil">

                        <i class="bi bi-person"></i>

                        Profil

                    </a>

                </li>

                {% if kullanici_rol == "Admin" %}

                <li>

                    <a class="dropdown-item"
                       href="/ayarlar/loglar">

                        <i class="bi bi-clock-history"></i>

                        Log Geçmişi

                    </a>

                </li>

                {% endif %}

                <li>
                    <hr class="dropdown-divider">
                </li>

                <li>

                    <a class="dropdown-item text-danger"
                       href="/logout">

                        <i class="bi bi-box-arrow-right"></i>

                        Çıkış

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>
