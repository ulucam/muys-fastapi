{% extends "base.html" %}

{% block title %}Yeni Kullanıcı{% endblock %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h4>👤 Yeni Kullanıcı</h4>

</div>

<div class="card-body">

<form action="/kullanicilar/ekle" method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Kullanıcı Adı</label>

<input
type="text"
name="kullanici_adi"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label>Şifre</label>

<input
type="password"
name="sifre"
class="form-control"
required>

</div>

</div>

<div class="mb-3">

<label>Ad Soyad</label>

<input
type="text"
name="ad_soyad"
class="form-control"
required>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Telefon</label>

<input
type="text"
name="telefon"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>E-Posta</label>

<input
type="email"
name="email"
class="form-control">

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Rol</label>

<select
name="rol"
class="form-select">

<option value="Admin">Admin</option>

<option value="Yönetici">Yönetici</option>

<option value="Satış">Satış</option>

<option value="Depo">Depo</option>

<option value="Operatör">Operatör</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Durum</label>

<select
name="aktif"
class="form-select">

<option value="true">Aktif</option>

<option value="false">Pasif</option>

</select>

</div>

</div>

<hr>

<div class="d-flex justify-content-end">

<a href="/kullanicilar"
class="btn btn-secondary me-2">

İptal

</a>

<button
type="submit"
class="btn btn-success">

💾 Kaydet

</button>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
