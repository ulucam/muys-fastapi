{% extends "base.html" %}

{% block title %}Kullanıcı Düzenle - MUYS{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Kullanıcı Düzenle: {{ kullanici.username }}</h5>
        </div>
        <div class="card-body">
            <form action="/kullanicilar/duzenle/{{ kullanici.id }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Kullanıcı Adı</label>
                    <input type="text" name="username" class="form-control" value="{{ kullanici.username }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ad Soyad</label>
                    <input type="text" name="full_name" class="form-control" value="{{ kullanici.full_name or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">E-Posta</label>
                    <input type="email" name="email" class="form-control" value="{{ kullanici.email or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select name="role" class="form-select" required>
                        <option value="admin" {% if kullanici.role == 'admin' %}selected{% endif %}>Admin</option>
                        <option value="yonetici" {% if kullanici.role == 'yonetici' %}selected{% endif %}>Yönetici</option>
                        <option value="satis" {% if kullanici.role == 'satis' %}selected{% endif %}>Satış</option>
                        <option value="depo" {% if kullanici.role == 'depo' %}selected{% endif %}>Depo</option>
                        <option value="operator" {% if kullanici.role == 'operator' %}selected{% endif %}>Operatör</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Yeni Şifre <small class="text-muted">(Değiştirmek istemiyorsanız boş bırakın)</small></label>
                    <input type="password" name="sifre" class="form-control" placeholder="••••••••">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="is_active" class="form-check-input" id="is_active" value="true" {% if kullanici.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">Aktif Kullanıcı</label>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/kullanicilar" class="btn btn-secondary">İptal</a>
                    <button type="submit" class="btn btn-success">Değişiklikleri Kaydet</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
