{% extends "base.html" %}

{% block title %}Kullanıcı Düzenle{% endblock %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-warning">

<h4>

✏️ Kullanıcı Düzenle

</h4>

</div>

<div class="card-body">

{% if hata %}<div class="alert alert-danger">{{ hata }}</div>{% endif %}

<form
action="/kullanicilar/duzenle/{{ kullanici.id }}"
method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Kullanıcı Adı</label>

<input
type="text"
name="kullanici_adi"
class="form-control"
value="{{ kullanici.kullanici_adi }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Yeni Şifre</label>

<input
type="password"
name="sifre"
class="form-control"
placeholder="Boş bırakılırsa değişmez">

</div>

</div>

<div class="mb-3">

<label>Ad Soyad</label>

<input
type="text"
name="ad_soyad"
class="form-control"
value="{{ kullanici.ad_soyad }}"
required>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Telefon</label>

<input
type="text"
name="telefon"
class="form-control"
value="{{ kullanici.telefon or '' }}">

</div>

<div class="col-md-6 mb-3">

<label>E-Posta</label>

<input
type="email"
name="email"
class="form-control"
value="{{ kullanici.email or '' }}">

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Rol</label>

<select
name="rol"
class="form-select"
id="rolSecimi">

<option value="Admin" {% if kullanici.rol=="Admin" %}selected{% endif %}>Admin</option>

<option value="Yönetici" {% if kullanici.rol=="Yönetici" %}selected{% endif %}>Yönetici</option>

<option value="Satış" {% if kullanici.rol=="Satış" %}selected{% endif %}>Satış</option>

<option value="Depo" {% if kullanici.rol=="Depo" %}selected{% endif %}>Depo</option>

<option value="Operatör" {% if kullanici.rol=="Operatör" %}selected{% endif %}>Operatör</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Durum</label>

<select
name="aktif"
class="form-select">

<option value="true" {% if kullanici.aktif %}selected{% endif %}>Aktif</option>

<option value="false" {% if not kullanici.aktif %}selected{% endif %}>Pasif</option>

</select>

</div>

</div>

<div class="mb-3" id="istasyonAlani" {% if kullanici.rol != 'Operatör' %}style="display:none"{% endif %}>
<label>Operatör Personeli</label>
<select name="personel_id" id="personelSecimi" class="form-select" {% if kullanici.rol == 'Operatör' %}required{% endif %}>
<option value="">Personel seçin</option>
{% for personel in personeller %}<option value="{{ personel.id }}" data-istasyonlar="{{ personel_istasyonlari.get(personel.id, [])|join(', ') }}" {% if kullanici.personel_id == personel.id %}selected{% endif %}>{{ personel.kodu }} · {{ personel.ad_soyad }}</option>{% endfor %}
</select>
<div id="personelIstasyonOzeti" class="form-text">Personelin yetkili istasyonları seçildiğinde burada görünür.</div>
</div>

<hr>

<div class="d-flex justify-content-between">

<a
href="/kullanicilar"
data-page-back
class="btn btn-secondary">

<i class="bi bi-arrow-left"></i> Geri

</a>

<button
type="submit"
class="btn btn-success">

💾 Kaydet

</button>

</div>

</form>

</div>

</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const rol = document.getElementById("rolSecimi");
    const alan = document.getElementById("istasyonAlani");
    const personel = document.getElementById("personelSecimi");
    const ozet = document.getElementById("personelIstasyonOzeti");
    function istasyonOzetiniGuncelle() {
        const secili = personel.options[personel.selectedIndex];
        const istasyonlar = secili ? secili.dataset.istasyonlar : "";
        ozet.textContent = istasyonlar ? "Yetkili istasyonlar: " + istasyonlar : "Bu personele henüz yetkili istasyon atanmadı.";
    }
    function istasyonAlaniniGuncelle() {
        const operatorMu = rol.value === "Operatör";
        alan.style.display = operatorMu ? "block" : "none";
        personel.required = operatorMu;
        if (!operatorMu) { personel.value = ""; }
        istasyonOzetiniGuncelle();
    }
    rol.addEventListener("change", istasyonAlaniniGuncelle);
    personel.addEventListener("change", istasyonOzetiniGuncelle);
    istasyonAlaniniGuncelle();
});
</script>
{% endblock %}
