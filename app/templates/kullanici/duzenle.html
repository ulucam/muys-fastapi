{% extends "base.html" %}
{% block content %}
<div class="container"><div class="card shadow-sm border-0"><div class="card-header bg-white py-3"><h4 class="mb-0">Kullanıcıyı düzenle</h4></div><div class="card-body">
{% if hata %}<div class="alert alert-danger">{{ hata }}</div>{% endif %}
<form method="post" action="/kullanicilar/duzenle/{{ kullanici.id }}" class="row g-3">
  <div class="col-md-6"><label class="form-label">Personel</label><select class="form-select" name="personel_id" required>{% for p in personeller %}<option value="{{ p.id }}" {% if p.id == kullanici.personel_id %}selected{% endif %}>{{ p.kodu }} · {{ p.ad_soyad }}</option>{% endfor %}</select></div>
  <div class="col-md-3"><label class="form-label">Kullanıcı adı</label><input class="form-control" name="kullanici_adi" value="{{ kullanici.kullanici_adi }}" required></div><div class="col-md-3"><label class="form-label">Yeni şifre</label><input class="form-control" type="password" name="sifre" placeholder="Değişmeyecekse boş"></div>
  <div class="col-md-4"><label class="form-label">Rol</label><select class="form-select" name="rol">{% for r in roller %}<option value="{{ r.adi }}" {% if r.adi == kullanici.rol %}selected{% endif %}>{{ r.adi }} · Seviye {{ r.seviye }}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label">E-posta</label><input class="form-control" type="email" name="email" value="{{ kullanici.email or '' }}"></div><div class="col-md-4"><label class="form-label">Telefon</label><input class="form-control" name="telefon" value="{{ kullanici.telefon or '' }}"></div>
  <div class="col-md-4"><label class="form-label">Durum</label><select class="form-select" name="aktif"><option value="true" {% if kullanici.aktif %}selected{% endif %}>Aktif</option><option value="false" {% if not kullanici.aktif %}selected{% endif %}>Pasif</option></select></div>
  <div class="col-12 d-flex justify-content-between"><a class="btn btn-outline-secondary" href="/kullanicilar">Geri</a><button class="btn btn-success">Kaydet</button></div>
</form></div></div></div>
{% endblock %}
