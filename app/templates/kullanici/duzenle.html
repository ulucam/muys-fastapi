{% extends "base.html" %}

{% block title %}Kullanıcı Düzenle{% endblock %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-warning">

<h4>

✏️ Kullanıcı Düzenle

</h4>

</div>

<div class="card-body">

<form
action="/kullanicilar/duzenle/{{ kullanici.id }}"
method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Kullanıcı Adı</label>

<input
type="text"
name="kullanici_adi"
class="form-control"
value="{{ kullanici.kullanici_adi }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Yeni Şifre</label>

<input
type="password"
name="sifre"
class="form-control"
placeholder="Boş bırakılırsa değişmez">

</div>

</div>

<div class="mb-3">

<label>Ad Soyad</label>

<input
type="text"
name="ad_soyad"
class="form-control"
value="{{ kullanici.ad_soyad }}"
required>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Telefon</label>

<input
type="text"
name="telefon"
class="form-control"
value="{{ kullanici.telefon or '' }}">

</div>

<div class="col-md-6 mb-3">

<label>E-Posta</label>

<input
type="email"
name="email"
class="form-control"
value="{{ kullanici.email or '' }}">

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Rol</label>

<select
name="rol"
class="form-select">

<option value="Admin" {% if kullanici.rol=="Admin" %}selected{% endif %}>Admin</option>

<option value="Yönetici" {% if kullanici.rol=="Yönetici" %}selected{% endif %}>Yönetici</option>

<option value="Satış" {% if kullanici.rol=="Satış" %}selected{% endif %}>Satış</option>

<option value="Depo" {% if kullanici.rol=="Depo" %}selected{% endif %}>Depo</option>

<option value="Operatör" {% if kullanici.rol=="Operatör" %}selected{% endif %}>Operatör</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Durum</label>

<select
name="aktif"
class="form-select">

<option value="true" {% if kullanici.aktif %}selected{% endif %}>Aktif</option>

<option value="false" {% if not kullanici.aktif %}selected{% endif %}>Pasif</option>

</select>

</div>

</div>

<hr>

<div class="d-flex justify-content-between">

<a
href="/kullanicilar"
class="btn btn-secondary">

← Geri

</a>

<button
type="submit"
class="btn btn-success">

💾 Kaydet

</button>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
