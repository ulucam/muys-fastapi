<div class="page-header">
    <div>
        <h2>Kullanıcılar</h2>
        <small>Sistem kullanıcılarını yönetin</small>
    </div>

    <div class="header-actions">
        <input
            type="text"
            class="search-input"
            placeholder="Kullanıcı ara...">

        <button class="btn btn-primary">
            <i class="fa fa-plus"></i>
            Yeni Kullanıcı
        </button>
    </div>
</div>

<div class="user-list">

{% for user in kullanicilar %}

<div class="user-card">

    <div class="user-left">

        <div class="avatar">
            {{ user.ad_soyad[0] }}
        </div>

        <div>

            <h5>{{ user.ad_soyad }}</h5>

            <div class="user-info">

                <span>@{{ user.kullanici_adi }}</span>

                <span>{{ user.rol }}</span>

                {% if user.aktif %}
                    <span class="badge bg-success">Aktif</span>
                {% else %}
                    <span class="badge bg-danger">Pasif</span>
                {% endif %}

            </div>

        </div>

    </div>

    <div class="user-right">

        <a class="btn btn-outline-primary btn-sm">

            <i class="fa fa-pen"></i>

        </a>

        <a class="btn btn-outline-danger btn-sm">

            <i class="fa fa-trash"></i>

        </a>

    </div>

</div>

{% endfor %}

</div>
